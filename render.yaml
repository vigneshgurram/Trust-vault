databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault_user
    plan: free
    region: oregon

services:
  - type: web
    name: trustvault-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn trustvault.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - key: ALLOWED_HOSTS
        value: "*"
